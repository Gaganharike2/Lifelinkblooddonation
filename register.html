<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | LifeLink</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card row g-0">
      <div class="col-lg-5 auth-side p-5 d-flex flex-column justify-content-between">
        <a href="/"><img src="/assets/logo.svg" alt="LifeLink" class="brand-logo bg-white rounded p-2"></a>
        <div>
          <h1 class="fw-bold mt-5">Join the LifeLink network</h1>
          <p class="text-white-50">Register as a donor, hospital or NGO. OTP verification activates the account.</p>
        </div>
      </div>
      <div class="col-lg-7 p-4 p-md-5">
        <h2 class="fw-bold">Create account</h2>
        <form id="registerForm" class="row g-3 mt-2">
          <div class="col-md-6"><label class="form-label">Full name / organization</label><input name="name" class="form-control" required></div>
          <div class="col-md-6"><label class="form-label">Role</label><select name="role" class="form-select"><option value="donor">Donor</option><option value="patient">Patient</option><option value="hospital">Hospital</option><option value="blood_bank">Blood Bank</option><option value="camp_organizer">Camp Organizer</option><option value="ngo">NGO</option><option value="volunteer">Volunteer</option></select></div>
          <div class="col-md-6"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required></div>
          <div class="col-md-6"><label class="form-label">Mobile</label><input name="mobile" class="form-control" required></div>
          <div class="col-md-6"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div>
          <div class="col-md-6"><label class="form-label">Blood group</label><select name="blood_group" class="form-select"><option value="">Not applicable</option><option>O+</option><option>O-</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option></select></div>
          <div class="col-md-6"><label class="form-label">City</label><input name="city" class="form-control"></div>
          <div class="col-md-6"><label class="form-label">Referral code</label><input name="referral_code" class="form-control"></div>
          <div class="col-12"><label class="form-label">Address</label><input name="address" class="form-control"></div>
          <div class="col-12"><button class="btn btn-lifelink btn-lg w-100">Register and send OTP</button></div>
        </form>
        <div id="otpPanel" class="d-none mt-4 p-3 bg-light rounded">
          <h5>Verify OTP</h5>
          <form id="otpForm" class="d-flex gap-2">
            <input name="otp" class="form-control" maxlength="6" placeholder="6 digit OTP" required>
            <button class="btn btn-dark">Verify</button>
          </form>
        </div>
        <div class="row g-2 mt-4">
          <div class="col-sm-6">
            <a class="btn btn-outline-dark w-100" href="/pages/login.html"><i class="fa-solid fa-right-to-bracket me-2"></i>Login</a>
          </div>
          <div class="col-sm-6">
            <a class="btn btn-outline-lifelink w-100" href="/pages/forgot-password.html"><i class="fa-solid fa-key me-2"></i>Forgot Password</a>
          </div>
        </div>
        <p class="mt-3 mb-0 text-muted">Already registered? <a href="/pages/login.html">Login</a></p>
      </div>
    </div>
  </main>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
