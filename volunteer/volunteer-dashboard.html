<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LifeLink Volunteer Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="dashboard-body">
  <div class="container-fluid"><div class="row">
    <aside class="col-lg-2 sidebar p-4"><a href="/"><img src="/assets/logo.svg" class="brand-logo" alt="LifeLink"></a><button class="btn btn-outline-danger mt-4" data-logout>Logout</button></aside>
    <main class="col-lg-10 dash-main">
      <div class="d-flex flex-wrap justify-content-between gap-3 mb-4"><div><p class="text-muted mb-1">LifeLink Volunteer Dashboard</p><h1 class="h2 fw-bold">Welcome, <span data-user-name></span></h1></div><span class="badge text-bg-light p-3">Referral: <strong data-referral-code></strong></span></div>
      <div class="row g-3 mb-4"><div class="col-md-4"><div class="surface metric p-4"><span class="text-muted">Open requests</span><h2 data-open-requests>0</h2></div></div><div class="col-md-4"><div class="surface metric p-4"><span class="text-muted">Verified donors</span><h2 data-donors>0</h2></div></div><div class="col-md-4"><div class="surface metric p-4"><span class="text-muted">Reward points</span><h2 data-points>0</h2></div></div></div>
      <section class="surface p-4"><h4>Volunteer response board</h4><p class="text-muted">Coordinate camps, emergency outreach, donor calls and local transport support.</p><div class="table-responsive"><table class="table"><thead><tr><th>Patient</th><th>Blood</th><th>Units</th><th>Urgency</th><th>Hospital</th><th>City</th><th>Status</th></tr></thead><tbody id="requestsRows"></tbody></table></div></section>
      <section id="globalRolePanel" class="surface p-4 mt-4"></section>
    </main>
  </div></div>
  <script src="https://unpkg.com/lucide@latest"></script><script src="/js/common.js"></script><script src="/js/dashboard.js"></script>
  <script>document.addEventListener('DOMContentLoaded', async () => { LifeLink.requireRole(['volunteer']); bindLogout(); LifeLink.initIcons(); try { await loadSummary(); await loadRequests(); await loadGlobalRolePanel(); } catch (error) { LifeLink.toast(error.message, 'error'); } });</script>
</body>
</html>
