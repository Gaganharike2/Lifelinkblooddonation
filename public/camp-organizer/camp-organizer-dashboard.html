<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LifeLink Camp Organizer Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="dashboard-body">
  <div class="container-fluid"><div class="row">
    <aside class="col-lg-2 sidebar p-4"><a href="/"><img src="/assets/logo.svg" class="brand-logo" alt="LifeLink"></a><nav class="nav flex-lg-column gap-2 mt-4"><a class="nav-link" href="#camp">Create camp</a><a class="nav-link" href="#donors">Donors</a><a class="nav-link" href="#plans">Subscription</a><button class="btn btn-outline-danger mt-2" data-logout>Logout</button></nav></aside>
    <main class="col-lg-10 dash-main">
      <div class="d-flex flex-wrap justify-content-between gap-3 mb-4"><div><p class="text-muted mb-1">LifeLink Camp Organizer Dashboard</p><h1 class="h2 fw-bold">Blood camp operations</h1></div><span class="badge text-bg-light p-3">QR attendance ready</span></div>
      <section id="camp" class="surface p-4"><h4>Create blood camp</h4><form id="campForm" class="row g-2 mt-2"><div class="col-md-3"><input name="title" class="form-control" placeholder="Camp title" required></div><div class="col-md-3"><input name="venue" class="form-control" placeholder="Venue"></div><div class="col-md-2"><input name="city" class="form-control" placeholder="City"></div><div class="col-md-2"><input name="camp_date" type="date" class="form-control" required></div><div class="col-md-2"><button class="btn btn-lifelink w-100">Create</button></div></form></section>
      <section id="donors" class="surface p-4 mt-4"><h4>Donor leaderboard and badges</h4><table class="table"><thead><tr><th>#</th><th>Name</th><th>Blood</th><th>Points</th><th>Badge</th></tr></thead><tbody id="leaderboardRows"></tbody></table></section>
      <section id="globalRolePanel" class="surface p-4 mt-4"></section>
      <section id="plans" class="mt-4"><div class="row g-3" id="companyPlanRows"></div></section>
    </main>
  </div></div>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script><script src="/js/common.js"></script><script src="/js/dashboard.js"></script><script src="/js/company.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      LifeLink.requireRole(['camp_organizer','ngo','admin','super_admin']); bindLogout(); await loadCompanyConsole(); bindSubscriptionButtons(); await loadRiskAndLeaderboard(); await loadGlobalRolePanel();
      document.querySelector('#campForm').addEventListener('submit', async (event) => { event.preventDefault(); await LifeLink.api('/api/company/blood-camps', { method: 'POST', body: JSON.stringify(Object.fromEntries(new FormData(event.target))) }); LifeLink.toast('Blood camp created', 'success'); event.target.reset(); });
    });
  </script>
</body>
</html>
