<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LifeLink Patient Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="dashboard-body">
  <div class="container-fluid"><div class="row">
    <aside class="col-lg-2 sidebar p-4"><a href="/"><img src="/assets/logo.svg" class="brand-logo" alt="LifeLink"></a><nav class="nav flex-lg-column gap-2 mt-4"><a class="nav-link" href="#emergency">Emergency</a><a class="nav-link" href="#tracking">Tracking</a><a class="nav-link" href="#leaderboard">Donors</a><button class="btn btn-outline-danger mt-2" data-logout>Logout</button></nav></aside>
    <main class="col-lg-10 dash-main">
      <div class="d-flex flex-wrap justify-content-between gap-3 mb-4"><div><p class="text-muted mb-1">LifeLink Patient Dashboard</p><h1 class="h2 fw-bold">Emergency blood support</h1></div><span class="badge text-bg-light p-3">Nexa Assistant ready</span></div>
      <section id="emergency" class="surface p-4">
        <h4>Create emergency blood request</h4>
        <form id="emergencyForm" class="row g-2 mt-2">
          <div class="col-md-3"><input name="patient_name" class="form-control" placeholder="Patient name" required></div>
          <div class="col-md-2"><select name="blood_group" class="form-select"><option>O+</option><option>O-</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option></select></div>
          <div class="col-md-2"><input name="units_needed" type="number" class="form-control" placeholder="Units" value="1"></div>
          <div class="col-md-2"><input name="city" class="form-control" placeholder="City" required></div>
          <div class="col-md-3"><input name="hospital_name" class="form-control" placeholder="Hospital"></div>
          <div class="col-md-4"><input name="contact_mobile" class="form-control" placeholder="Contact mobile"></div>
          <div class="col-md-5"><input name="symptoms" class="form-control" placeholder="Critical notes"></div>
          <div class="col-md-3"><button class="btn btn-lifelink w-100">Broadcast alert</button></div>
        </form>
      </section>
      <section id="tracking" class="surface p-4 mt-4"><h4>Request tracking</h4><div class="table-responsive"><table class="table"><thead><tr><th>Patient</th><th>Blood</th><th>Units</th><th>City</th><th>Priority</th><th>Status</th></tr></thead><tbody id="emergencyRows"></tbody></table></div></section>
      <section id="globalRolePanel" class="surface p-4 mt-4"></section>
      <section id="leaderboard" class="surface p-4 mt-4"><h4>Top verified donors</h4><table class="table"><tbody id="leaderboardRows"></tbody></table></section>
    </main>
  </div></div>
  <script src="/js/common.js"></script><script src="/js/dashboard.js"></script><script src="/js/company.js"></script>
  <script>document.addEventListener('DOMContentLoaded', async () => { LifeLink.requireRole(['patient','admin','super_admin']); bindLogout(); bindEmergencyForm(); await loadEmergencyRequests(); await loadRiskAndLeaderboard(); await loadGlobalRolePanel(); });</script>
</body>
</html>
