<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | LifeLink</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card row g-0">
      <div class="col-lg-5 auth-side p-5 d-flex flex-column justify-content-between">
        <a href="/"><img src="/assets/logo.svg" alt="LifeLink" class="brand-logo bg-white rounded p-2"></a>
        <div>
          <h1 class="fw-bold mt-5">Welcome back to LifeLink</h1>
          <p class="text-white-50">Open your donor, hospital, NGO or admin workspace with secure verification.</p>
        </div>
      </div>
      <div class="col-lg-7 p-4 p-md-5">
        <h2 class="fw-bold">Login</h2>
        <form id="loginForm" class="mt-4">
          <div class="mb-3"><label class="form-label">Email or mobile</label><input name="identifier" class="form-control form-control-lg" required></div>
          <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control form-control-lg" required></div>
          <button class="btn btn-lifelink btn-lg w-100">Login</button>
        </form>
        <div class="row g-2 mt-3">
          <div class="col-sm-6">
            <a class="btn btn-outline-lifelink w-100" href="/pages/forgot-password.html"><i class="fa-solid fa-key me-2"></i>Forgot Password</a>
          </div>
          <div class="col-sm-6">
            <a class="btn btn-outline-dark w-100" href="/pages/register.html"><i class="fa-solid fa-user-plus me-2"></i>Create Account</a>
          </div>
        </div>
        <div id="otpPanel" class="d-none mt-4 p-3 bg-light rounded">
          <h5>Verify OTP</h5>
          <form id="otpForm" class="d-flex gap-2">
            <input name="otp" class="form-control" maxlength="6" placeholder="6 digit OTP" required>
            <button class="btn btn-dark">Verify</button>
          </form>
        </div>
        <div id="forgotPanel" class="d-none mt-4 p-3 bg-light rounded">
          <h5>Reset password</h5>
          <p class="text-muted small mb-3">Enter your registered email or mobile number. LifeLink will send an OTP for password reset.</p>
          <form id="forgotPasswordForm" class="row g-2">
            <div class="col-12"><input name="identifier" class="form-control" placeholder="Email or mobile" required></div>
            <div class="col-12"><button class="btn btn-outline-danger w-100">Send reset OTP</button></div>
          </form>
          <form id="resetPasswordForm" class="row g-2 d-none mt-3">
            <div class="col-md-6"><input name="otp" class="form-control" maxlength="6" placeholder="6 digit OTP" required></div>
            <div class="col-md-6"><input name="password" type="password" class="form-control" placeholder="New password" required></div>
            <div class="col-12"><input name="confirm_password" type="password" class="form-control" placeholder="Confirm new password" required></div>
            <div class="col-12"><button class="btn btn-dark w-100">Update password</button></div>
          </form>
        </div>
        <p class="mt-4 mb-0 text-muted">New here? <a href="/pages/register.html">Create an account</a></p>
      </div>
    </div>
  </main>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
