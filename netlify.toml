[build]
  publish = "public"

[[redirects]]
  from = "/api/*"
  to = "https://lifelink-api-gl4z.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://lifelink-api-gl4z.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
